<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1315">
<title>Relevé M130</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Mode terrain sombre : plan en haut, panneau de saisie en bas (iPhone) ou à droite (Mac). */
:root {
  --bg: #0f1315; --sheet: #182024; --line: #2d383d; --grid: #1b2327;
  --ink: #eef2f1; --soft: #c5cfd0; --muted: #9aa8ac; --dim: #5b686d;
  --laser: #ff5a47; --laser-t: #ff7a6b; --door: #f0b440; --win: #63c7e6; --ok: #6fd39a;
  --f-ui: Archivo, system-ui, -apple-system, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.35 var(--f-ui); display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--laser); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 12px; flex: none; border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.iconbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.iconbtn[aria-pressed="true"] { border-color: var(--ink); }
.ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 0; text-align: left; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ttl b { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; background: transparent; flex: none; white-space: nowrap; }
.conn .d { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-sizing: border-box; }
.conn[data-s="off"] { background: var(--laser); border-color: var(--laser); color: #fff; font-weight: 600; }
.conn[data-s="off"] .d, .conn[data-s="na"] .d { display: none; }
.conn[data-s="sleep"] { border-style: dashed; border-color: var(--dim); color: var(--ink); }
.conn[data-s="sleep"] .d { background: none; border: 2px solid var(--muted); }
.conn[data-s="wait"] .d { background: var(--laser); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.tabs { display: none; gap: 4px; padding: 3px; border-radius: 10px; background: var(--sheet); }
.tabs button { height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: var(--soft); font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--line); color: var(--ink); font-weight: 600; }

.app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#stage { position: relative; flex: 1; min-height: 200px; touch-action: none; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); font-size: 18px; padding: 0; display: flex; align-items: center; justify-content: center; }
#toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px;
  font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); width: max-content; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }

#sheet { flex: none; max-height: 56%; overflow-y: auto; background: var(--sheet); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 900px) {
  .app { flex-direction: row; }
  #sheet { max-height: none; width: 410px; border-radius: 0; border-left: 1px solid var(--line); }
  .tabs { display: flex; }
  #houseBtn { display: none; }
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; align-items: center; overflow-x: auto; flex: none; }
.chip { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; white-space: nowrap; flex: none; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.chip.on.door { background: var(--door); border-color: var(--door); }
.chip.on.win { background: var(--win); border-color: var(--win); }
.chip.dash { border-style: dashed; border-color: var(--dim); color: var(--soft); }
.chip.armed { border-color: var(--laser); color: var(--laser-t); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { display: flex; gap: 14px; padding: 10px; border-radius: 14px; background: var(--bg); border: 1px solid var(--laser); }
.card.plain { border-color: var(--line); }
.pict { width: 76px; height: 76px; flex: none; border-radius: 10px; background: var(--sheet); display: flex; align-items: center; justify-content: center; }
.cardtxt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.wait { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--laser-t); }
.wait i { width: 7px; height: 7px; border-radius: 50%; background: var(--laser); animation: blink 1.4s infinite; }
.wait.off { color: var(--muted); }
.wait.off i { background: var(--muted); animation: none; }
.big { font-size: 21px; font-weight: 700; }
.hint { font-size: 13px; line-height: 1.4; color: var(--soft); margin: 0; }
.small { font-size: 12px; line-height: 1.4; color: var(--muted); margin: 0; }
.btn { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 14px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.btn.danger { color: var(--laser-t); border-color: var(--laser); }
.btn.grow { flex: 1; }
.linkbtn { border: 0; background: none; color: var(--soft); text-decoration: underline; font-size: 13px; padding: 6px 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 11px; color: var(--muted); }
.stat b { font: 600 15px var(--f-num); }
.tr { display: grid; grid-template-columns: 44px 1fr 1fr 64px; font: 14px var(--f-num); min-height: 28px; align-items: center; font-variant-numeric: tabular-nums;
  background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.tr.h { font: 11px var(--f-ui); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tr .m { color: var(--muted); }
.r { text-align: right; }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; gap: 10px; align-items: center; min-height: 50px; padding: 4px 10px; border-radius: 10px; background: var(--bg); border: 1px solid transparent; }
.step.cur { border-color: var(--laser); }
.num { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--dim); display: flex; align-items: center; justify-content: center; flex: none; font-size: 12px; color: var(--muted); }
.step.cur .num { border: 2px solid var(--laser); color: var(--laser-t); font-weight: 700; }
.num.done { background: var(--ok); border-color: var(--ok); }
.stxt { flex: 1; display: flex; flex-direction: column; min-width: 0; background: none; border: 0; padding: 4px 0; text-align: left; }
.stxt b { font-size: 14px; }
.stxt span { font-size: 12px; color: var(--soft); }
.val { font: 600 14px var(--f-num); }
.val.m { color: var(--muted); font-weight: 400; }
.mini { height: 32px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--line); background: transparent; font: 12px var(--f-num); color: var(--soft); }
.mini.on { border: 1.5px solid var(--ink); color: var(--ink); font-weight: 600; }
.swing { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; flex: 1; }
.swing button { height: 42px; border-radius: 8px; border: 1px solid var(--line); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; }
.swing button.on { border: 1.5px solid var(--door); background: #f0b44022; }
.field { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font: 15px var(--f-num); min-width: 0; }
.okdot { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ok); flex: none; }
.okdot.warn { background: var(--laser); }
.rrow { display: grid; grid-template-columns: 1fr 66px 86px 36px; align-items: center; min-height: 36px; font-size: 14px; border-radius: 8px; padding: 0 6px; margin: 0 -6px; }
.rrow.sel { background: #ffffff0d; }
.rrow.warn { background: #ff5a4718; }
.rrow > button:first-child { background: none; border: 0; padding: 6px 0; text-align: left; font-size: 14px; }
.rrow .g { font: 13px var(--f-num); color: var(--soft); }
.rrow .x { width: 32px; height: 32px; border: 0; background: none; color: var(--muted); font-size: 18px; }
.rrow .x.armed { color: var(--laser-t); font-size: 12px; }
.st-ok { font-size: 12px; color: var(--ok); } .st-open { font-size: 12px; color: var(--muted); } .st-warn { font-size: 12px; color: var(--laser-t); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; }
.crumb .p { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--bg); color: var(--soft); }
.crumb .p i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.crumb .c { height: 30px; display: flex; align-items: center; padding: 0 10px; border-radius: 999px; border: 1px solid var(--laser); font-weight: 600; }
.warnbox { border: 1px solid var(--laser); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.aim { display: flex; gap: 8px; align-items: stretch; }
.pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; flex: none; }
.pad button { border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center; }
.pad button.on { border: 1.5px solid var(--laser); background: #ff5a4720; color: var(--laser-t); }
.pad .mid { font-size: 11px; color: var(--soft); }
.toggle { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.toggle button { flex: 1; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 13px; text-align: left; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.toggle button.on { border: 1.5px solid var(--ink); background: #ffffff0d; font-weight: 600; }
.toggle small { font-size: 11px; color: var(--muted); font-weight: 400; }
#print { display: none; }
@media print {
  body { background: #fff; overflow: visible; display: block; height: auto; }
  header, .app { display: none !important; }
  #print { display: block; }
  #print svg { width: 100%; height: auto; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* v5 : étapes de la pièce, pastilles d'avancement, fiches, vérifications */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: 10px; background: var(--bg); flex: none; }
.seg button { height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--soft); font-size: 13px; }
.seg button.on { background: var(--line); color: var(--ink); font-weight: 600; }
.seg button.done { color: var(--ok); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font: 12px var(--f-num); color: var(--soft); white-space: nowrap; }
.pill.ok { border-color: var(--ok); color: var(--ok); }
.pill.cur { border: 1.5px solid var(--laser); color: var(--laser-t); font-weight: 600; }
.pill.ded { border-style: dashed; color: var(--muted); }
.warnpill { border-color: var(--laser); color: var(--laser-t); font-weight: 600; }
.warnpill[hidden] { display: none; }
.fhead { display: flex; align-items: center; gap: 8px; }
.fhead .x { margin-left: auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 20px; padding: 0; color: var(--soft); flex: none; }
.sides { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--soft); }
.chk { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.chk.warn { border-color: var(--laser); }
.pad span.mid { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; color: var(--muted); line-height: 1.1; }
.step .pict { width: 56px; height: 56px; }
.btn.huge { min-height: 56px; font-size: 17px; }
.form3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.form3 label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="houseBtn" data-act="house" aria-label="Voir toute la maison" aria-pressed="false">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#eef2f1" stroke-width="1.8" aria-hidden="true"><path d="M3 9 L10 3 L17 9 V17 H3 Z"></path><path d="M8 17 V12 H12 V17"></path></svg>
  </button>
  <div class="ttl"><span class="eyebrow" id="eyebrow"></span><b id="rname"></b></div>
  <div class="tabs"><button data-act="view:releve" id="tabR">Relevé</button><button data-act="view:maison" id="tabA">Maison</button></div>
  <button class="conn warnpill" id="chk" data-act="checks" aria-label="Vérifications à faire" hidden>⚠ <span id="chkN">0</span></button>
  <button class="conn" id="conn" data-act="conn" data-s="off"><span class="d"></span><span id="connTxt">Connecter</span></button>
</header>
<div class="app">
  <main id="stage">
    <svg id="plan" aria-label="Plan"></svg>
    <div class="zoom">
      <button data-act="zin" aria-label="Zoomer">+</button>
      <button data-act="zout" aria-label="Dézoomer">−</button>
      <button data-act="fit" aria-label="Tout afficher"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#eef2f1" stroke-width="1.6" aria-hidden="true"><path d="M2 6 V2 H6 M12 2 H16 V6 M16 12 V16 H12 M6 16 H2 V12"></path></svg></button>
    </div>
    <div id="toast" role="status"></div>
  </main>
  <section id="sheet"></section>
</div>
<div id="print"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
/* Relevé M130 — v5
   La maison est faite de pièces. Chaque point appartient à une pièce ; les points des autres pièces sont verrouillés
   (ni mesurables, ni cibles de fusion, ni cibles de « jusqu'au mur »). Les pièces ne sont reliées que par les portes/passages,
   les cloisons (automatiques ou explicites), les alignements confirmés et les cotes « À travers ».
   Une pièce se dessine d'abord (statut sketch : murs au croquis), puis se mesure mur après mur (statut measure), puis est fermée (closed).
   Les positions viennent d'un ajustement global par moindres carrés, robuste aux mesures aberrantes.
   Les données (D) sont séparées de l'état d'écran (ui) ; l'annulation restaure D et remet ui à zéro.

   API de test : globalThis.T (fin du script). Actions de T.act(nom, ...args) — ce sont aussi les data-act du panneau ("nom:arg1:arg2") :
     zin, zout, fit, conn, house, view(releve|maison), checks, undo, manual, manual-ok(valeur?), hist
     newRoom, arrow(deg), toWall(deg?), close-shape, go-measure, go-sketch, trace(1|0?), dir(deg), extend, drag(lettre, dx, dy)
     deduce, wall(idMur), wall-fiche, close
     control(idMesure), gocontrol(idMesure), control-later, merge, merge-new, merge-cancel
     door, passage, window (sur le mur de la fiche ouverte, ou idMur en argument), ref(a|b), step(clé), pos0, depth(m), depthc,
       details, swing(in|out|none, left|right), pickwall, cancel-op, validate
     pass(idOuverture?), opswing(in|out|none, left|right), thick(auto|m), delop
     notch, notch-mode(creux|saillie), notch-ref(a|b), notch-ok(pos?, largeur?, profondeur?, mode?, coin?), angle, angle-ok(degrés?), delmeas
     through(idMur), through-check, cote-cancel, part-thick(idMur, m)
     align-yes(clé), align-no(clé)
     room(idPièce), resume(idPièce), name-ok(nom?), height(idPièce?), height-cancel, delroom
     newhouse, export-json, open-json, export-png, export-pdf, export-dxf */
const $ = s => document.querySelector(s);
const svg = $("#plan"), sheet = $("#sheet"), NS = "http://www.w3.org/2000/svg";
const KEY = "releve-m130-v5", KEY4 = "releve-m130-v4";
const DARK = { ink: "#eef2f1", room: "#6fd39a10", laser: "#ff5a47", door: "#f0b440", win: "#63c7e6", muted: "#9aa8ac", soft: "#c5cfd0", label: "#eef2f1", warn: "#ff9640", sketch: "#9aa8ac", dim: "#5b686d" };
const LIGHT = { ink: "#1c272c", room: "#1c272c08", laser: "#d93a2b", door: "#b7791f", win: "#2b8db3", muted: "#5b6a70", soft: "#3d4a50", label: "#1c272c", warn: "#1c272c", sketch: "#5b6a70", dim: "#9aa8ac" };
const STEPS = {
  door: [
    { k: "pos", t: "Position", h: "Dos au montant, vise le coin" },
    { k: "width", t: "Largeur", h: "Dos à un montant, vise l'autre" },
    { k: "height", t: "Hauteur", h: "M130 au sol, vise le haut du cadre", opt: true },
  ],
  window: [
    { k: "pos", t: "Position", h: "Dos contre un côté de l'embrasure, vise le coin" },
    { k: "width", t: "Largeur", h: "Dos contre un côté de l'embrasure, vise l'autre côté" },
    { k: "depth", t: "Profondeur", chips: [0.2, 0.3, 0.4], opt: true, detail: true },
    { k: "sill", t: "Allège", h: "M130 au sol, vise l'appui", opt: true, detail: true },
    { k: "height", t: "Haut de la fenêtre", h: "M130 au sol, vise le haut", opt: true, detail: true },
  ],
};
// incertitudes (m) : longueur mesurée (appui du M130 compris) et écart perpendiculaire (angles supposés droits)
const SIG = L => 0.004 + 0.001 * L;
const SIGP = L => 0.0005 + 0.0005 * L;
const SK = 0.5;              // longueur de croquis : observation très faible
const FLAG = 0.015;          // au-delà, une mesure est signalée « à vérifier »
const DEF = 1.5;             // longueur de croquis par défaut

/* ---------- données ---------- */
function blank() {
  return { v: 5, pts: [], meas: [], cons: [], rooms: [], openings: [], n: { pt: 0, id: 0, room: 0, door: 0, window: 0 },
    tol: 0.03, ask: 0.25, thick: 0.10, answers: {}, cur: null, nav: { dir: 0, turn: 1, trace: false } };
}
function normalize(d) {
  const b = blank();
  for (const k of Object.keys(b)) if (d[k] == null) d[k] = b[k];
  d.n = Object.assign(b.n, d.n);
  d.nav = Object.assign({ dir: 0, turn: 1, trace: false }, d.nav);
  for (const r of d.rooms) { if (!r.status) r.status = "closed"; if (r.loop == null) r.loop = r.status !== "sketch"; if (!r.turn) r.turn = 1; if (r.height === undefined) r.height = null; }
  if (d.cur && !d.rooms.some(r => r.id === d.cur)) d.cur = null;
  return d;
}
function loadStored() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.v === 5 && Array.isArray(d.pts)) return normalize(d); } catch {}
  try { const d = JSON.parse(localStorage.getItem(KEY4)); if (d && d.v === 4 && Array.isArray(d.pts)) return migrate(d); } catch {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch {} }
let D = blank(), SOL = null, CHK = null;
const ui = { view: "releve" };
function resetUi() {
  Object.assign(ui, { sel: null, wall: null, control: null, height: null, draft: null, pending: null, cote: null, manual: false, toWall: false,
    notch: false, notchMode: "creux", notchRef: "a", angle: false, details: false, customDepth: false, armDel: null, hist: false, thickPick: null, pickWall: false, alignPick: null, equalPick: null, replace: false });

  const area = D.rooms.reduce((t, r) => t + roomArea(r), 0);
  txt(out, pad, H - 26, `Surface des pièces : ${fmt(area, 2)} m² · cotes intérieures en mètres`, { size: 14, fill: LIGHT.muted, font: "Helvetica, Arial, sans-serif", anchor: "start" });

function exportPng() {

function exportPdf() { const s = houseSvg(); if (!s) return toast("Le plan est vide"); $("#print").replaceChildren(s.out); window.print(); }
function exportDxf() {
  const E = [], f = v => (+v).toFixed(4);

  const text = (p, hg, s, ly) => E.push("0", "TEXT", "8", ly, "10", f(p[0]), "20", f(-p[1]), "30", "0", "40", f(hg), "1", s);
  for (const m of D.meas) {
    const wg = wallGeom(m); if (!wg) continue;
    if (m.kind === "cote") { line(wg.A, wg.B, "COTES"); continue; }
    for (const [a, b] of wallPieces(wg, false)) line(a, b, "MURS");
    for (const o of openingsOn(m.id, false)) {
      const og = openingGeom(o, wg);
      if (o.type === "door" && o.swing === "none") line(og.J1, og.J2, "PASSAGES");
      else if (o.type === "door") {
        line(og.hinge, og.leafEnd, "PORTES");
        const a0 = Math.atan2(og.other[1] - og.hinge[1], og.other[0] - og.hinge[0]), a1 = Math.atan2(og.leafEnd[1] - og.hinge[1], og.leafEnd[0] - og.hinge[0]);
        let da = a1 - a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
        let prev = og.other;
        for (let i = 1; i <= 12; i++) { const a = a0 + da * i / 12, p = [og.hinge[0] + og.w * Math.cos(a), og.hinge[1] + og.w * Math.sin(a)]; line(prev, p, "PORTES"); prev = p; }
      } else { line(og.G1, og.G2, "FENETRES"); if (o.depth) { line(og.J1, og.G1, "MURS"); line(og.J2, og.G2, "MURS"); } }
    }
  }
  for (const r of D.rooms) { if (!r.loop) continue; const poly = roomPoly(r); if (poly.length < 3) continue; const c = centroid(poly); text(c, 0.18, r.name, "TEXTES"); text([c[0], c[1] + 0.3], 0.14, fmt(Math.abs(signedArea(poly)), 2) + " m2", "TEXTES"); }
  const s = ["0", "SECTION", "2", "HEADER", "9", "$INSUNITS", "70", "6", "0", "ENDSEC", "0", "SECTION", "2", "ENTITIES", ...E, "0", "ENDSEC", "0", "EOF"].join("\r\n");

/* ---------- Bluetooth M130 ---------- */
let device = null, linking = false, retry = null, buf = "";
const hooked = new WeakSet();
function setConn(s) {
  // ne redessine que l'en-tête et la ligne d'état : le panneau ne bouge pas pendant les tentatives de reconnexion
  conn = s; renderHeader();
  const w = $("#waitline"); if (w) w.outerHTML = waitLine();
}
// identifiants complets du service du M130 (certains navigateurs, dont Bluefy, n'acceptent pas les formes courtes)
const SVC = "0000ffb0-0000-1000-8000-00805f9b34fb", CHS = ["0000ffb2-0000-1000-8000-00805f9b34fb", "0000ffb1-0000-1000-8000-00805f9b34fb"];
async function pickDevice() {
  if (!navigator.bluetooth) { conn = "na"; renderHeader(); return toast("Bluetooth indisponible ici : ouvre l'app dans Bluefy (iPhone), Chrome ou Brave (Mac)"); }
  // du filtre le plus précis au plus large : si le navigateur refuse un filtre, on essaie le suivant
  const tries = [
    { filters: [{ services: [SVC] }, { namePrefix: "M130" }], optionalServices: [SVC] },
    { filters: [{ namePrefix: "M130" }], optionalServices: [SVC] },
    { acceptAllDevices: true, optionalServices: [SVC] },
  ];
  let err = null;
  for (const opts of tries) {
    try { const d = await navigator.bluetooth.requestDevice(opts); useDevice(d); await link(true); return; }
    catch (e) { err = e; if (e.name !== "TypeError" && e.name !== "NotSupportedError") break; }
  }
  const msg = String(err && err.message || ""), name = err && err.name;
  if (name === "NotFoundError" && /cancel|annul|chooser/i.test(msg)) return;                      // fenêtre fermée par l'utilisateur
  if (name === "NotFoundError" || /adapter|bluetooth.*(off|disabled|unavailable)/i.test(msg))
    return toast("Bluetooth du téléphone coupé ou non autorisé : vérifie Réglages → Bluetooth, puis Réglages → Bluefy → Bluetooth");
  if (name === "SecurityError" || name === "NotAllowedError")
    return toast("Bluetooth refusé pour ce site : autorise-le dans les réglages du navigateur, puis réessaie");
  toast(`Connexion impossible (${name || "erreur"} : ${msg.slice(0, 80) || "sans détail"}). Réveille le M130 et réessaie.`);
}
function useDevice(d) {
  if (device === d) return;
  device = d;
  d.addEventListener("gattserverdisconnected", () => { if (device !== d) return; setConn("sleep"); later(1500); });
}
function later(ms) { clearTimeout(retry); retry = setTimeout(() => { if (document.visibilityState === "visible") link(); else later(3000); }, ms); }
const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
async function link(loud) {
  if (!device || linking) return;
  if (device.gatt.connected) return setConn("on");
  linking = true; if (loud) setConn("wait");
  try {
    const server = await timeout(device.gatt.connect(), 10000), svc = await server.getPrimaryService(SVC);
    for (const u of CHS) {
      try { const ch = await svc.getCharacteristic(u); if (!hooked.has(ch)) { ch.addEventListener("characteristicvaluechanged", onData); hooked.add(ch); } await ch.startNotifications(); } catch {}
    }
    clearTimeout(retry); setConn("on"); toast("M130 connecté");
  } catch { try { device.gatt.disconnect(); } catch {} setConn("sleep"); later(3000); }
  finally { linking = false; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && device && !device.gatt.connected) link(); });
function onData(e) {
  const dv = e.target.value;
  buf += new TextDecoder().decode(dv.buffer.slice(dv.byteOffset, dv.byteOffset + dv.byteLength)).replace(/\0/g, "");
  const lines = buf.split(/\r?\n/); buf = lines.pop();
  for (const l of lines) { const m = parseLen(l); if (m != null && m > 0) onMeasure(m); else if (l.trim()) toast("Reçu : " + l.trim()); }
  if (buf.length > 64) buf = "";
}
function parseLen(t) {
  t = String(t).trim().replace(",", ".");
  if (!t) return null;
  let m = t.match(/^(\d+)'\s*(\d+(?:\.\d+)?)?(?:\s+(\d+)\/(\d+))?\s*"?$/);
  if (m) return (+m[1]) * 0.3048 + ((+m[2] || 0) + (m[3] ? m[3] / m[4] : 0)) * 0.0254;
  m = t.match(/^(-?\d+(?:\.\d+)?)\s*(mm|cm|m|ft|in|"|')?$/i);
  if (!m) return null;
  const v = +m[1], u = (m[2] || "m").toLowerCase();
  return { mm: v / 1000, cm: v / 100, m: v, ft: v * 0.3048, "'": v * 0.3048, in: v * 0.0254, '"': v * 0.0254 }[u];
}
if (navigator.bluetooth && navigator.bluetooth.getDevices) {
  navigator.bluetooth.getDevices().then(ds => { const d = ds.find(x => /M130/.test(x.name || "")); if (d) { useDevice(d); conn = "sleep"; renderHeader(); link(); } }).catch(() => {});
}

  html() { return sheet.innerHTML; },
  toast() { return lastToast; },
};
